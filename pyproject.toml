[project]
name = "pydonut"
version = "0.1.0"
description = "Python bindings for NVIDIA Donut and NVRHI: real-time Direct3D 12 and Vulkan rendering, hardware ray tracing, mesh shaders and GPU compute from Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ASDAlexander77", email = "duzhar@googlemail.com" }
]
requires-python = ">=3.14"
keywords = [
    "graphics",
    "rendering",
    "real-time-rendering",
    "3d",
    "gpu",
    "directx",
    "direct3d",
    "d3d12",
    "vulkan",
    "ray-tracing",
    "dxr",
    "nvrhi",
    "donut",
    "nvidia",
    "hlsl",
    "shaders",
    "mesh-shaders",
    "compute-shader",
    "gltf",
    "game-engine",
    "pybind11",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pybind11>=3.0.4",
]

[project.urls]
Homepage = "https://github.com/ASDAlexander77/PyDonut"
Repository = "https://github.com/ASDAlexander77/PyDonut"
Issues = "https://github.com/ASDAlexander77/PyDonut/issues"
Documentation = "https://github.com/ASDAlexander77/PyDonut#readme"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.uv]
# extern/donut is a vendored git submodule (itself containing nested submodules: nvrhi,
# imgui, glfw, cgltf, ShaderMake). Its sources/headers/CMake files feed directly into the
# pydonut native build, but local edits there (e.g. driver workarounds) don't touch anything
# under src/ or the top-level CMakeLists.txt -- without tracking them here, uv silently
# reuses a stale cached wheel that predates the submodule change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.{h,c,hpp,cpp}" },
    { file = "CMakeLists.txt" },
    { file = "extern/donut/**/*.{h,c,hpp,cpp,cc,cxx}" },
    { file = "extern/donut/**/CMakeLists.txt" },
    { file = "extern/donut/**/*.cmake" },
]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build.cmake.define]
PYNRI_ENABLE_D3D12 = "ON"
PYNRI_ENABLE_VULKAN = "ON"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search_path = [
    "src",
    "test",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
